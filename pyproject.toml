[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-reflex"
version = "0.1.0"
description = "Deterministic execution control for probabilistic coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "requests>=2.31",
    "jsonschema>=4.21",
    "referencing>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.15",
    "bandit>=1.8",
    "pip-audit>=2.8",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]

[project.scripts]
jev-reflex = "jev_reflex.cli:app"
jrx = "jev_reflex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/jev-reflex/benchmarks/stability" = ["benchmarks/stability/*.json"]

[tool.setuptools.package-data]
jev_reflex = ["fixtures/policy_golden/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/jev_reflex"]
follow_imports = "silent"
show_error_codes = true

[tool.bandit]
targets = ["src/jev_reflex"]
skips = ["B104", "B108"]
