name: JRX policy impact
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: jrx-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: vars.JRX_POLICY_IMPACT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: jrx-impact
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      POLICY: policies/agent.yaml
    steps:
      - name: Mark this PR revision pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='jrx/policy-impact' -f state=pending -f description='Preparing policy replay'

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Read the merged policy as data
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          # GitHub can take a few seconds to regenerate its test merge commit.
          for attempt in 1 2 3 4 5; do
            if git fetch --quiet --no-tags --depth=2 origin "refs/pull/$PR/merge"; then
              merge=$(git rev-parse FETCH_HEAD)
              if [[ "$(git rev-parse "$merge^1")" == "$BASE" &&
                    "$(git rev-parse "$merge^2")" == "$HEAD_SHA" ]]; then
                break
              fi
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'The GitHub test merge is unavailable or stale. Rerun against the current PR.' >&2
              exit 2
            fi
            sleep 2
          done
          for rev in "$BASE" "$merge"; do
            mode=$(git ls-tree "$rev" -- "$POLICY" | cut -d' ' -f1)
            if [[ "$mode" != 100644 && "$mode" != 100755 ]]; then
              echo 'The base and proposed merge must both contain a regular policy file.' >&2
              exit 2
            fi
            if [[ "$(git cat-file -s "$rev:$POLICY")" -gt 1048576 ]]; then
              echo 'The policy exceeds the 1 MiB replay limit.' >&2
              exit 2
            fi
          done
          if git diff --quiet --no-ext-diff --no-textconv "$BASE" "$merge" -- "$POLICY"; then
            echo 'Policy file unchanged.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git cat-file blob "$BASE:$POLICY" > "$RUNNER_TEMP/base.yaml"
            git cat-file blob "$merge:$POLICY" > "$RUNNER_TEMP/candidate.yaml"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate snapshot pin
        if: steps.inputs.outputs.changed == 'true'
        env:
          SNAPSHOT: ${{ vars.JRX_EVIDENCE_SHA }}
        run: '[[ "$SNAPSHOT" =~ ^[0-9a-f]{40}$ ]]'

      - name: Install the trusted base revision
        if: steps.inputs.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/jrx"
          "$RUNNER_TEMP/jrx/bin/python" -m pip install --quiet .

      - name: Read the private snapshot
        if: steps.inputs.outputs.changed == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.JRX_EVIDENCE_REPO }}
          ref: ${{ vars.JRX_EVIDENCE_SHA }}
          token: ${{ secrets.JRX_EVIDENCE_TOKEN }}
          path: .jrx-evidence
          persist-credentials: false
          sparse-checkout: audit.jsonl
          sparse-checkout-cone-mode: false

      - name: Replay and publish aggregate counts
        id: replay
        if: steps.inputs.outputs.changed == 'true'
        shell: bash
        env:
          MAX_NEW_ALLOWS: ${{ vars.JRX_MAX_NEW_ALLOWS }}
        run: |
          snapshot=.jrx-evidence/audit.jsonl
          test -f "$snapshot" && test ! -L "$snapshot" || exit 2
          args=(--audit "$snapshot" --baseline "$RUNNER_TEMP/base.yaml"
                --candidate "$RUNNER_TEMP/candidate.yaml" --github-output "$GITHUB_OUTPUT")
          if [[ -n "$MAX_NEW_ALLOWS" ]]; then
            args+=(--max-new-allows "$MAX_NEW_ALLOWS")
          fi
          rc=0
          "$RUNNER_TEMP/jrx/bin/python" -I -m jev_reflex policy impact "${args[@]}" \
            >> "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Attach the result to the PR head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RC: ${{ steps.replay.outputs.rc }}
          COUNTS: ${{ steps.replay.outputs.counts }}
          CHANGED: ${{ steps.inputs.outputs.changed }}
        run: |
          state=error
          desc='Unassessed. See workflow run.'
          if [[ "$RESULT" == success ]]; then
            state=success
            if [[ "$CHANGED" == false ]]; then
              desc='Policy file unchanged.'
            else
              desc="$COUNTS"
            fi
          elif [[ "$RC" == 1 && -n "$COUNTS" ]]; then
            state=failure
            desc="Limit exceeded. $COUNTS"
          fi
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='jrx/policy-impact' -f state="$state" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
