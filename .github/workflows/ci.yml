name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*.*.*']
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,harness]"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.0.5'
      - name: Cache image for the sandbox integration tests
        if: runner.os == 'Linux'
        run: docker pull python:3.11-slim
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m bandit -c pyproject.toml -r src/jev_reflex -ll

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/jev-reflex-clean"
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/jev-reflex-clean/share/jev-reflex/reflex.example.yaml" reflex.example.yaml
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m jev_reflex --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jev-reflex" --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" policy impact --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" policy lint --config reflex.example.yaml
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" check --config reflex.example.yaml --demo --command "rm -rf ./cache" --json |
            jq -e '.decision == "HOLD"' >/dev/null
          "$RUNNER_TEMP/jev-reflex-clean/bin/jev-reflex" policy test --config reflex.example.yaml --json
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" policy test --config reflex.example.yaml --json
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m jev_reflex check --demo --command "pytest tests/" --json
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m jev_reflex benchmark stability --runs 1 --json
      - name: Verify release tag matches installed package
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$("$RUNNER_TEMP/jev-reflex-clean/bin/python" -c 'from jev_reflex import __version__; print(__version__)')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match the packaged version v$version" >&2
            exit 1
          fi

  broker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t jrx-ci .
      - name: Check broker startup with the Helm configuration and packaged health probe
        shell: bash
        run: |
          helm lint helm/jrx-broker
          config="$RUNNER_TEMP/reflex.yaml"
          helm template ci helm/jrx-broker --show-only templates/configmap.yaml | yq -r '.data."reflex.yaml"' > "$config"
          uid=$(helm show values helm/jrx-broker | yq '.podSecurityContext.runAsUser')
          container=$(docker run --detach --network none --user "$uid" --read-only --cap-drop ALL \
            --tmpfs /tmp:mode=1777 --mount "type=bind,src=$config,dst=/home/jrx/reflex.yaml,readonly" \
            --health-interval=2s jrx-ci)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          timeout 90 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" "$1")" = healthy ]; do sleep 2; done' _ "$container"
          docker exec "$container" python -m pip check
