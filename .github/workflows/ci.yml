name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: |
          python -m venv "$RUNNER_TEMP/jev-reflex-clean"
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m jev_reflex --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jev-reflex" --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" --help
          "$RUNNER_TEMP/jev-reflex-clean/bin/jev-reflex" policy test --config "$GITHUB_WORKSPACE/reflex.example.yaml" --json
          "$RUNNER_TEMP/jev-reflex-clean/bin/jrx" policy test --config "$GITHUB_WORKSPACE/reflex.example.yaml" --json
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m jev_reflex check --demo --command "pytest tests/" --json
          "$RUNNER_TEMP/jev-reflex-clean/bin/python" -m jev_reflex benchmark stability --runs 1 --json
