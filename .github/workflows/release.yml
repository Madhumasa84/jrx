name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/madhumasa84/jrx-broker
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.15.0

      - name: Generate SBOM
        env:
          IMAGE_REF: ghcr.io/madhumasa84/jrx-broker@${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE_REF" \
            --output spdx-json \
            --file sbom.spdx.json

      - name: Sign the published Docker image with keyless OIDC
        env:
          IMAGE_REF: ghcr.io/madhumasa84/jrx-broker@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attach SBOM to image and sign
        env:
          IMAGE_REF: ghcr.io/madhumasa84/jrx-broker@${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            "$IMAGE_REF"

      - name: Attach distributions and SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.spdx.json
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
