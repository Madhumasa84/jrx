name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/madhumasa84/jrx-broker
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.15.0

      - name: Generate SBOM
        run: |
          syft ghcr.io/madhumasa84/jrx-broker:${{ github.ref_name }} \
            --output spdx-json \
            --file sbom.spdx.json

      - name: Sign the published Docker image with keyless OIDC
        uses: sigstore/cosign-action@v3.5.0
        with:
          image-refs: ${{ steps.meta.outputs.tags }}

      - name: Attach SBOM to image and sign
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            --type spdxjson \
            ${{ steps.meta.outputs.tags }}
          cosign sign ${{ steps.meta.outputs.tags }} \
            --attachment sbom

      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
